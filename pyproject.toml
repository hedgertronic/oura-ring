[project]
name = "oura-ring"
version = "1.0.2"
description = "Python client for the Oura API v2 with OAuth2 support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Josh Hejka", email = "josh@joshhejka.com" }]
keywords = ["oura", "oura ring", "wearable", "sleep", "health", "api", "fitness"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/hedgertronic/oura-ring"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oura_ring"]

[dependency-groups]
dev = [
    "pytest>=8",
    "coverage[toml]>=7",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "B",
    "C4",
    "UP",
    "SIM",
    "D",
    "S",
    "A",
    "ERA",
    "TRY",
    "C90",
]
# TRY003: we raise stdlib exceptions with inline messages.
ignore = ["D212", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D", "E501"]

[tool.mypy]
files = ["oura_ring", "tests"]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Test functions are intentionally unannotated and lean on mock objects whose
# attribute access is typed `Any`. Relax the strict-only purity flags so the
# suite is still checked, but isn't forced to annotate every fixture and mock.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false

[tool.coverage.run]
source = ["oura_ring"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
